# GitHub Actions pipeline for Agentic BI.
#
# This file lives under infrastructure/ci because the automation account used to
# prepare this repository is not permitted to create files under .github/workflows
# (the GitHub App lacks the `workflows` scope). Install it with:
#
#   mkdir -p .github/workflows && cp infrastructure/ci/github-actions.yml .github/workflows/ci.yml
#
# The workflow is otherwise ready to run unchanged.
name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — tests, migrations, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Run test suite (87 tests incl. 55-question AI benchmark)
        working-directory: apps/api
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          LLM_ENABLED: "false"
          GEMINI_API_KEY: ""
        run: python -m pytest -q

      - name: Verify Alembic migrations
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: python scripts/check_migrations.py

      - name: Seed demo workspace
        env:
          PYTHONPATH: apps/api
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///apps/api/data/ci.db
          STORAGE_LOCAL_ROOT: apps/api/data/ci-storage
        run: python apps/api/scripts/seed_demo.py

      - name: HTTP smoke test
        env:
          PYTHONPATH: apps/api
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///apps/api/data/ci-smoke.db
          STORAGE_LOCAL_ROOT: apps/api/data/ci-smoke-storage
        run: python scripts/smoke_e2e.py

  web:
    name: Web — typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          tags: agentic-bi-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          build-args: BACKEND_URL=http://api:8000
          tags: agentic-bi-web:ci

  e2e:
    name: Playwright (manual/nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r apps/api/requirements-dev.txt
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API
        run: |
          PYTHONPATH=apps/api python apps/api/scripts/seed_demo.py
          PYTHONPATH=apps/api nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
      - name: Start web
        working-directory: apps/web
        run: nohup npm run dev > /tmp/web.log 2>&1 &
      - name: Run Playwright
        working-directory: apps/web
        env:
          E2E_EMAIL: demo@agenticbi.dev
          E2E_PASSWORD: DemoPass123!
        run: npx playwright test
